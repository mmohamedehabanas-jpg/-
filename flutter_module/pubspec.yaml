name: haqq_allah_flutter
description: "Haqq Allah Islamic Flutter Module for Quran Reader & Athan (Version 3.0)"
version: 3.0.0+30
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  audioplayers: ^5.2.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - packages/haqqallah/mushaf.ttf
    - assets/audio/default_azan.mp3
