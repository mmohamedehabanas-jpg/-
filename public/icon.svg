<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0b382a"/>
      <stop offset="60%" stop-color="#041f17"/>
      <stop offset="100%" stop-color="#010c08"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded squircle for maskable/any -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  
  <!-- Outer Gold Arabesque Lattice Border -->
  <rect x="24" y="24" width="464" height="464" rx="95" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.4"/>
  <rect x="36" y="36" width="440" height="440" rx="85" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.75" stroke-dasharray="10 5"/>

  <!-- Islamic Mihrab Arch Frame -->
  <path d="M256 90 C180 135 120 200 120 300 L120 410 L392 410 L392 300 C392 200 332 135 256 90 Z" fill="none" stroke="url(#gold)" stroke-width="6" filter="url(#glow)"/>
  <path d="M256 112 C196 150 144 210 144 300 L144 394 L368 394 L368 300 C368 210 316 150 256 112 Z" fill="#041a13" stroke="url(#emerald)" stroke-width="3" opacity="0.85"/>

  <!-- Golden 8-Pointed Star (Rub el Hizb) Centerpiece -->
  <g transform="translate(256, 275)" filter="url(#glow)">
    <rect x="-58" y="-58" width="116" height="116" rx="14" fill="url(#gold)" opacity="0.95"/>
    <rect x="-58" y="-58" width="116" height="116" rx="14" fill="url(#gold)" transform="rotate(45)" opacity="0.95"/>
    <circle cx="0" cy="0" r="44" fill="#031811" stroke="url(#gold)" stroke-width="3"/>
    
    <!-- Arabic Calligraphy / Quran Motif -->
    <path d="M-15 8 C-10 15 10 15 15 8 C10 -5 -10 -5 -15 8 Z" fill="url(#gold)"/>
    <circle cx="0" cy="-12" r="5" fill="url(#gold)"/>
  </g>

  <!-- Glowing Crescent at Arch Top -->
  <path d="M268 135 A 18 18 0 1 1 246 160 A 14 14 0 1 0 268 135 Z" fill="url(#gold)" filter="url(#glow)"/>
  <circle cx="260" cy="142" r="2.5" fill="#fef08a"/>

  <!-- App Title Typography in Kufic Style at Bottom -->
  <text x="256" y="450" font-family="'Cairo', 'Amiri', serif" font-size="34" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="4">حَقُّ اللَّهِ</text>
  <text x="256" y="475" font-family="'Cairo', sans-serif" font-size="14" font-weight="600" fill="#a7f3d0" text-anchor="middle" letter-spacing="2">HAQQ ALLAH V2.7</text>
</svg>
